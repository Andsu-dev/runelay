name: deploy-lp

on:
  push:
    branches: [main]
    paths: ["apps/lp/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vite build
        working-directory: apps/lp
      - run: bunx wrangler@4.162.0 pages deploy dist --project-name runeley --branch main --commit-hash "$GITHUB_SHA"
        working-directory: apps/lp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
