name: deploy-docs

on:
  push:
    branches: [main]
    paths: ["apps/docs/**", "CHANGELOG.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
        working-directory: apps/docs
      - run: bunx wrangler@4.162.0 pages project create runelay-docs --production-branch main || true
      - run: bunx wrangler@4.162.0 pages deploy apps/docs/dist/client --project-name runelay-docs --branch main --commit-hash "$GITHUB_SHA"
